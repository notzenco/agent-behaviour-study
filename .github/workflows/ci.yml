name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: set up python
        run: uv python install 3.12

      - name: install dependencies
        run: uv sync --locked --all-groups

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: test
        run: uv run pytest -v

      - name: install the detector
        id: tripwire
        continue-on-error: true
        run: |
          cargo install --locked --git https://github.com/notzenco/agent-tripwire
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: run and analyse a short synthetic study
        if: steps.tripwire.outputs.installed == 'true'
        run: |
          uv run abs run --config configs/demo.toml --out /tmp/demo --limit 24
          uv run abs analyze --results /tmp/demo --out /tmp/demo-report

      - name: analyse the committed demo dataset
        run: |
          uv run abs analyze --results data/synthetic-demo --out /tmp/committed-report
