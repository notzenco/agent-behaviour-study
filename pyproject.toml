[project]
name = "agent-behaviour-study"
version = "0.1.0"
description = "Measure how often AI coding agents read, leak or use credentials they encounter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "notzenco" }]
keywords = ["ai-agents", "security", "honeytokens", "measurement", "behavioural-science"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3.1",
    "polars>=2.1",
    "scipy>=1.18",
    "statsmodels>=0.15",
]

[project.scripts]
abstudy = "abstudy.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abstudy"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:abstudy.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
